<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مهندس اشترخانی | خدمات تخصصی زیرساخت IT، هوش مصنوعی و اتوماسیون</title>
  
  <!-- فونت وزیرمتن از گوگل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- آیکون‌های Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* هاله‌های نوری پس‌زمینه */
    .ambient-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.25;
      pointer-events: none;
    }
    .glow-1 { top: -60px; right: -60px; background: var(--accent-cyan); }
    .glow-2 { bottom: -60px; left: -60px; background: var(--accent-purple); }

    .main-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 1;
    }

    /* کارت پروفایل اصلی */
    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .avatar-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background-color: #1e293b;
    }

    .rep-name {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .rep-role {
      font-size: 0.9rem;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(11, 15, 25, 0.6);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 18px;
    }

    .contact-info-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
      direction: ltr;
    }

    .contact-info-item i {
      color: var(--accent-cyan);
      width: 18px;
      height: 18px;
    }

    /* دکمه‌های اکشن */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #ffffff;
      box-shadow: 0 8px 20px -6px rgba(6, 182, 212, 0.5);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.15);
    }

    /* بخش‌های لیست خدمات */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .section-header i {
      width: 24px;
      height: 24px;
    }

    .header-it { color: var(--accent-cyan); }
    .header-ai { color: var(--accent-purple); }

    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
    }

    .services-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* دکمه‌های بازشونده خدمات */
    .skill-interactive-btn {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: right;
    }

    .skill-interactive-btn:hover,
    .skill-interactive-btn:active {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(6, 182, 212, 0.4);
      transform: translateX(-3px);
    }

    .skill-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* انیمیشن رادار (Sonar Pulse) هر ۳ ثانیه */
    .radar-dot {
      position: relative;
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .radar-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent-cyan);
      animation: sonarPulse 3s infinite cubic-bezier(0, 0.2, 0.8, 1);
    }

    .dot-purple { background-color: var(--accent-purple); }
    .dot-purple::after { background: var(--accent-purple); }

    @keyframes sonarPulse {
      0% {
        width: 8px;
        height: 8px;
        opacity: 0.9;
      }
      40% {
        width: 24px;
        height: 24px;
        opacity: 0;
      }
      100% {
        width: 24px;
        height: 24px;
        opacity: 0;
      }
    }

    .hint-click {
      color: var(--text-muted);
      opacity: 0.6;
      display: flex;
      align-items: center;
    }

    /* مودال پاپ‌آپ */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 15, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      transform: scale(0.92);
      transition: all 0.3s ease;
      position: relative;
    }

    .modal-backdrop.active .modal-box {
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-icon-badge {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(6, 182, 212, 0.12);
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .modal-desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.65;
      margin-bottom: 16px;
    }

    .modal-benefit-box {
      background: rgba(6, 182, 212, 0.06);
      border-right: 3px solid var(--accent-cyan);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #38bdf8;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="main-container">

    <!-- کارت پروفایل -->
    <section class="profile-card">
      <div class="avatar-wrapper">
        <img src="profile.jpg" alt="مهندس اشترخانی" class="avatar-img">
      </div>

      <h1 class="rep-name">مهندس اشترخانی</h1>
      <p class="rep-role">نماینده ارشد فنی و توسعه زیرساخت</p>

      <div class="contact-details">
        <div class="contact-info-item">
          <i data-lucide="phone"></i>
          <span>۰۹۲۰-۵۰۵-۴۵۵۷</span>
        </div>
      </div>

      <div class="action-buttons">
        <a href="tel:09205054557" class="btn btn-primary">
          <i data-lucide="phone-call" style="width: 18px; height: 18px;"></i>
          تماس مستقیم
        </a>
        <button onclick="downloadVCard()" class="btn btn-secondary">
          <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
          ذخیره مخاطب
        </button>
      </div>
    </section>

    <!-- بخش خدمات IT -->
    <section class="section-card">
      <div class="section-header header-it">
        <i data-lucide="server"></i>
        <h2 class="section-title">زیرساخت، شبکه و امنیت داده</h2>
      </div>
      <div class="services-list">
        <button class="skill-interactive-btn" onclick="openSkillModal('infra')">
          <span class="skill-label">
            <span class="radar-dot"></span>
            راه‌اندازی صفر تا صد زیرساخت فیزیکی و پسیو شبکه
          </span>
          <span class="hint-click"><i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i></span>
        </button>

        <button class="skill-interactive-btn" onclick="openSkillModal('cisco')">
          <span class="skill-label">
            <span class="radar-dot"></span>
            کانفیگ و پیکربندی تخصصی سوئیچینگ و روتینگ سیسکو
          </span>
          <span class="hint-click"><i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i></span>
        </button>

        <button class="skill-interactive-btn" onclick="openSkillModal('firewall')">
          <span class="skill-label">
            <span class="radar-dot"></span>
            استقرار فایروال‌های پیشرفته و امنیت داده سازمانی
          </span>
          <span class="hint-click"><i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i></span>
        </button>

        <button class="skill-interactive-btn" onclick="openSkillModal('storage')">
          <span class="skill-label">
            <span class="radar-dot"></span>
            راهکارهای ذخیره‌سازی داده (Storage) و بک‌آپ اضطراری
          </span>
          <span class="hint-click"><i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i></span>
        </button>

        <button class="skill-interactive-btn" onclick="openSkillModal('voip')">
          <span class="skill-label">
            <span class="radar-dot"></span>
            راه‌اندازی و پیاده‌سازی مراکز تلفن VoIP
          </span>
          <span class="hint-click"><i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i></span>
        </button>
      </div>
    </section>

    <!-- بخش خدمات AI -->
    <section class="section-card">
      <div class="section-header header-ai">
        <i data-lucide="sparkles"></i>
        <h2 class="section-title">هوش مصنوعی و تولید محتوا</h2>
      </div>
      <div class="services-list">
        <button class="skill-interactive-btn" onclick="openSkillModal('ai_multimedia')">
          <span class="skill-label">
            <span class="radar-dot dot-purple"></span>
            تولید محتوای چندرسانه‌ای با AI (انیمیشن، تیزر، لوگو و عکس)
          </span>
          <span class="hint-click"><i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i></span>
        </button>

        <button class="skill-interactive-btn" onclick="openSkillModal('web_content')">
          <span class="skill-label">
            <span class="radar-dot dot-purple"></span>
            تولید محتوای متنی، سئو و مقالات تخصصی وب‌سایت
          </span>
          <span class="hint-click"><i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i></span>
        </button>
      </div>
    </section>

    <footer>
      تیم مهندسی و توسعه فناوری | پاسخگویی و پشتیبانی سریع
    </footer>

  </main>

  <!-- مودال پاپ‌آپ -->
  <div class="modal-backdrop" id="skillModal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-box">
      <button class="modal-close-btn" onclick="closeSkillModal()">
        <i data-lucide="x" style="width: 18px; height: 18px;"></i>
      </button>
      <div class="modal-icon-badge" id="modalBadge">
        <i data-lucide="info" id="modalIcon"></i>
      </div>
      <h3 class="modal-title" id="modalTitle">عنوان خدمت</h3>
      <p class="modal-desc" id="modalDesc">توضیحات تکمیلی</p>
      <div class="modal-benefit-box" id="modalBenefit">
        مزیت تجاری
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const skillsData = {
      infra: {
        title: 'راه‌اندازی صفر تا صد زیرساخت فیزیکی شبکه',
        icon: 'network',
        desc: 'طراحی، کابل‌کشی ساختاریافته (Cat6/Cat7)، فیبر نوری، آرایش تخصصی رک، پچ‌پنل و لیبل‌گذاری استاندارد متناسب با توسعه آینده کسب‌وکار شما.',
        benefit: 'نتیجه: پایداری ۱۰۰٪ ارتباطات داخلی، حذف نویز و کاهش چشمگیر زمان قطعی شبکه.'
      },
      cisco: {
        title: 'کانفیگ تخصصی سوئیچینگ و روتینگ سیسکو',
        icon: 'cpu',
        desc: 'پیاده‌سازی سناریوهای پیشرفته VLAN بندی، پروتکل‌های مسیریابی (OSPF/EIGRP)، افزونگی لینک‌ها (STP/EtherChannel) و جداسازی ترافیک دپارتمان‌ها.',
        benefit: 'نتیجه: افزایش چشمگیر سرعت انتقال دیتا، جلوگیری از تداخل بسته‌ها و بهبود کارایی سیستم‌ها.'
      },
      firewall: {
        title: 'استقرار فایروال‌های پیشرفته و امنیت شبکه',
        icon: 'shield-check',
        desc: 'راه‌اندازی فایروال‌های سخت‌افزاری و نرم‌افزاری (FortiGate, Kerio, Mikrotik)، کنترل دسترسی کاربران، مسدودسازی نفوذ و پایش زنده ترافیک.',
        benefit: 'نتیجه: حفاظت کامل از داده‌های حساس سازمان در برابر حملات سایبری و باج‌افزارها.'
      },
      storage: {
        title: 'راهکارهای ذخیره‌سازی و بک‌آپ اضطراری',
        icon: 'database',
        desc: 'راه‌اندازی استوریج‌های سازمانی (NAS/SAN/DAS)، پیکربندی RAID و تدوین سیستم بک‌آپ‌گیری خودکار و منظم با Veeam Backup.',
        benefit: 'نتیجه: تضمین عدم حذف یا از دست رفتن فایل‌ها و بازیابی فوری در حوادث غیرمترقبه.'
      },
      voip: {
        title: 'راه‌اندازی و پیاده‌سازی مراکز تلفن VoIP',
        icon: 'phone-forwarded',
        desc: 'طراحی و استقرار تلفن‌های تحت شبکه بر بستر Asterisk و Issabel؛ منشی گویا (IVR)، صف تماس، ضبط مکالمات و اتصال کارکنان از هر نقطه دنیا با داخلی اختصاصی.',
        benefit: 'نتیجه: کاهش چشمگیر هزینه تماس، حرفه‌ای‌تر شدن ارتباط با مشتری و مدیریت متمرکز مکالمات.'
      },
      ai_multimedia: {
        title: 'تولید محتوای چندرسانه‌ای با هوش مصنوعی',
        icon: 'wand-2',
        desc: 'خلق تیزرهای تبلیغاتی مدرن، لوگو، تصاویر اختصاصی برند و انیمیشن‌های صنعتی با پیشرفته‌ترین موتورهای هوش مصنوعی روز دنیا.',
        benefit: 'نتیجه: کاهش بیش از ۷۰ درصدی زمان و هزینه‌های استودیویی همراه با خروجی فوق‌العاده باکیفیت.'
      },
      web_content: {
        title: 'تولید محتوای متنی، سئو و مقالات تخصصی',
        icon: 'file-text',
        desc: 'تولید محتوای متنی استاندارد و تخصصی منطبق با اصول سئو گوگل برای وب‌سایت‌ها، جهت افزایش رتبه در موتورهای جستجو و جذب مشتری هدفمند.',
        benefit: 'نتیجه: افزایش ورودی ارگانیک سایت از گوگل و تثبیت اعتبار برند شما به عنوان مرجع حوزه کاری.'
      }
    };

    function openSkillModal(skillKey) {
      const data = skillsData[skillKey];
      if (!data) return;

      document.getElementById('modalTitle').innerText = data.title;
      document.getElementById('modalDesc').innerText = data.desc;
      document.getElementById('modalBenefit').innerText = data.benefit;
      
      const iconElement = document.getElementById('modalIcon');
      iconElement.setAttribute('data-lucide', data.icon);
      
      lucide.createIcons();

      const modal = document.getElementById('skillModal');
      modal.classList.add('active');
    }

    function closeSkillModal() {
      const modal = document.getElementById('skillModal');
      modal.classList.remove('active');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'skillModal') {
        closeSkillModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSkillModal();
    });

    function downloadVCard() {
      const vCardContent = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN;CHARSET=UTF-8:مهندس اشترخانی (تیم فنی و اتوماسیون)',
        'N;CHARSET=UTF-8:اشترخانی;مهندس;;;',
        'TITLE;CHARSET=UTF-8:نماینده ارشد فنی و توسعه زیرساخت',
        'TEL;TYPE=CELL,VOICE:09205054557',
        'NOTE;CHARSET=UTF-8:خدمات زیرساخت IT، امنیت شبکه، VoIP و راهکارهای هوش مصنوعی',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vCardContent], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Engineer-Ashtarkhani.vcf');
